name: Build iOS (IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart versions
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build iOS app (Release, no code sign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 מעקב_פיננסי.ipa Payload
          zip -r -9 Runner.ipa Payload
          ls -la

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-IPA
          path: build/ios/iphoneos/*.ipa
          retention-days: 14
