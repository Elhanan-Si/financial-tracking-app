name: Create GitHub Release (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Android Release Artifacts
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/FinancialTracking-Android.apk
          cp build/app/outputs/bundle/release/app-release.aab output/FinancialTracking-Android.aab

      - name: Upload Android Temp Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: output/*
          retention-days: 1

  build-ios:
    name: Build iOS Release (IPA)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build iOS app (Release, no code sign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 ../../../FinancialTracking-iOS.ipa Payload
          cd ../../..

      - name: Upload iOS Temp Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-binaries
          path: FinancialTracking-iOS.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-binaries
          path: release_files/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-binaries
          path: release_files/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "גרסה ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/FinancialTracking-Android.apk
            release_files/FinancialTracking-Android.aab
            release_files/FinancialTracking-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
